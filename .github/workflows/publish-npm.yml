name: Publish npm package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing plugin tag (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish the verified package (false builds and verifies only)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - name: Validate release tag
        id: identity
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          path: plugin
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test release tooling
        run: python3 tooling/scripts/test_npm_release.py
      - name: Install pinned BB build tool
        run: npm install --prefix bb-tool bb-app@0.49.0 --no-audit --no-fund
      - name: Install locked plugin dependencies without lifecycle scripts
        working-directory: plugin
        run: npm ci --omit=dev --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Prepare publishable manifest
        run: python3 tooling/scripts/npm_release.py prepare --root plugin --tag "$RELEASE_TAG"
      - name: Build BB backend, frontend and host bundles
        run: bb-tool/node_modules/.bin/bb plugin build plugin
      - name: Pack the built plugin
        working-directory: plugin
        run: |
          mkdir -p ../artifacts
          npm pack --ignore-scripts --pack-destination ../artifacts
      - name: Use the Node 22 runtime compatible with older Macs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Verify tarball and install with Git disabled
        run: |
          mkdir -p no-git
          printf '#!/bin/sh\necho "Git must not be used to install the npm package" >&2\nexit 1\n' > no-git/git
          chmod +x no-git/git
          export PATH="$PWD/no-git:$PATH"
          npm install --prefix consumer --ignore-scripts --omit=optional --no-audit --no-fund ./artifacts/*.tgz
          python3 tooling/scripts/npm_release.py verify --root consumer/node_modules/bb-plugin-svaib-workplace --tag "$RELEASE_TAG"
          node --input-type=module -e 'const m = await import(process.argv[1]); if (typeof m.default !== "function") throw new Error("Missing BB plugin factory")' "file://$PWD/consumer/node_modules/bb-plugin-svaib-workplace/dist/server.js"
          node --check consumer/node_modules/bb-plugin-svaib-workplace/dist/host.js
          python3 tooling/scripts/npm_release.py receipt --tarball "artifacts/bb-plugin-svaib-workplace-${RELEASE_TAG#v}.tgz" --output artifacts/receipt.json
          cp plugin/npm-release.json artifacts/source.json
          cp tooling/scripts/npm_release.py artifacts/npm_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with OIDC support
        run: npm install --global npm@12.2.0 --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: artifacts
      - name: Publish the exact verified tarball
        env:
          # One-time bootstrap only. Remove this secret after connecting the
          # npm package to this workflow's trusted publisher; OIDC then takes over.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('artifacts')
          receipt = json.loads((root / 'receipt.json').read_text())
          assert hashlib.sha256((root / receipt['filename']).read_bytes()).hexdigest() == receipt['sha256']
          PY
          npm publish ./artifacts/*.tgz --access public
      - name: Confirm registry publication
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 artifacts/npm_release.py wait-registry --tag "v$VERSION" --tarball "artifacts/bb-plugin-svaib-workplace-$VERSION.tgz" --timeout 900
