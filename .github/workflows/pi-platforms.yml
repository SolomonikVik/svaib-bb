name: Pi wizard and session continuity
on:
  push:
    branches: ['check/pi-setup-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pi-platforms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-pi:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest, windows-11-arm, macos-15-intel, macos-15]
        bb: ['0.48.1', '0.49.0']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run typecheck
      - name: Pi setup, native profile, managed profile, command and registration regressions
        run: npx tsx --test tests/kimi-pi-native-setup.test.ts tests/kimi-pi-setup.test.ts tests/kimi-pi-native.test.ts tests/kimi-pi-host.test.ts tests/native-command.test.ts tests/windows-node.test.ts tests/pi-registration.test.ts
      - name: Real npm copy and dependency verification
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_prepare_methods.py tests/test_prepare_pi_runtime.py
      - name: Actual managed Pi, portable Node, empty PATH and credential preservation
        run: npx tsx scripts/check-pi-managed.ts
      - name: Install the selected official BB
        run: npm install --prefix "${{ runner.temp }}/pi-bb-tools" --no-audit --no-fund bb-app@${{ matrix.bb }}
      - name: Build with the actual supported BB version
        run: node "${{ runner.temp }}/pi-bb-tools/node_modules/bb-app/dist/bb.js" plugin build .
      - name: Real absent Pi installation, wizard completion, profile recreation and session continuity
        run: python scripts/check-pi-master.py --bb-package "${{ runner.temp }}/pi-bb-tools/node_modules/bb-app" --artifacts "${{ runner.temp }}/pi-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-${{ matrix.runner }}-bb-${{ matrix.bb }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/pi-acceptance/result.json
            ${{ runner.temp }}/pi-acceptance/model-requests.jsonl
            ${{ runner.temp }}/pi-acceptance/bb-server.log
